{% extends "base.html" %}
{% load static %}

{% block title %}Каталог — Fiesta{% endblock %}

{% block content %}
  <p class="crumbs"><a href="{% url 'home' %}">Главная</a> · Каталог</p>
  <h1>Каталог</h1>
  <div class="bento">
    {% for tile in tiles %}
      <a class="tile tile-{{ tile.css }}" href="{% url 'category_catalog' tile.category.pk %}">
        {% if tile.image %}
          <img src="{% static 'img/catalog/' %}{{ tile.image }}" alt="">
        {% endif %}
        <span class="tile-label place-{{ tile.place }}">{{ tile.label }}</span>
      </a>
    {% empty %}
      <p>Категорий пока нет.</p>
    {% endfor %}
  </div>
{% endblock %}
